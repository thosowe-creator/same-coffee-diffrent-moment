<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f8f7f3" />
  <title>Same Coffee, Different Moment</title>
  <style>
    :root{
      --bg:#f8f7f3;
      --paper:#ffffff;
      --ink:#181818;
      --muted:#8c8a83;
      --line:#e9e7e1;
      --soft:#efede7;
      --coffee:#6d4c35;
      --coffee-soft:#d8c7b7;
      --max:520px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--ink);
      background:var(--bg);
      font-family:Montserrat,"Noto Sans KR",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button,input,textarea{font:inherit}
    button{color:inherit}
    .shell{width:min(100%,var(--max));margin:0 auto;min-height:100vh;background:var(--paper)}
    .topbar{
      position:sticky;top:0;z-index:40;
      height:56px;padding:0 16px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      background:rgba(255,255,255,.94);
      backdrop-filter:blur(16px);
      border-bottom:1px solid var(--line);
    }
    .brand{min-width:0;font-size:12px;line-height:1.4;font-weight:800;letter-spacing:.02em;overflow-wrap:break-word}
    .language-control{position:relative;flex:0 0 94px;width:94px}
    .language-control::after{content:"";position:absolute;right:14px;top:50%;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none}
    .language-select{appearance:none;-webkit-appearance:none;-moz-appearance:none;display:block;box-sizing:border-box;font:inherit;font-size:12px;line-height:20px;width:100%;min-height:40px;margin:0;padding:9px 30px 9px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer}
    .language-select:focus-visible{outline:2px solid var(--coffee);outline-offset:2px}
    h1{white-space:pre-line}
    html[lang="ko"] h1{line-height:1.25}
    .hero{padding:34px 18px 24px;border-bottom:1px solid var(--line)}
    h1{font-size:34px;line-height:1.04;letter-spacing:-.045em;margin:10px 0 14px}
    .hero p{font-size:14px;line-height:1.7;color:#66635f;margin:0;max-width:510px}
    .feed{padding-bottom:90px}
    .post{border-top:1px solid var(--line);background:#fff}
    .post-head{display:flex;align-items:center;gap:10px;padding:14px 16px}
    .avatar{
      width:35px;height:35px;border-radius:50%;background:var(--soft);
      display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--coffee)
    }
    .post-meta{min-width:0}
    .post-user{overflow-wrap:anywhere;font-size:12px;font-weight:800;letter-spacing:.01em}
    .post-loc{font-size:10px;color:var(--muted);margin-top:3px}
    .post-time{margin-left:auto;flex-shrink:0;font-size:10px;color:#8c8a83;font-variant-numeric:tabular-nums;white-space:nowrap}
    .post-image{
      width:100%;aspect-ratio:4/3;background:#ece8e2;display:block;object-fit:cover;
    }
    .post-placeholder{
      aspect-ratio:4/3;display:flex;align-items:flex-end;padding:24px;
      background:
        radial-gradient(circle at 80% 20%,rgba(255,255,255,.7),transparent 24%),
        linear-gradient(135deg,#d9d0c7 0%,#f3eee8 48%,#c2aa94 100%);
    }
    .placeholder-copy{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:rgba(24,24,24,.58)}
    .actions{display:flex;align-items:center;gap:18px;padding:13px 16px 7px}
    .icon-btn{border:0;background:transparent;padding:0;display:flex;align-items:center;gap:6px;cursor:pointer}
    .icon-btn svg{width:22px;height:22px;stroke-width:1.7}
    .icon-btn.liked svg{fill:#181818}
    .like-count,.comment-count{font-size:11px;font-weight:700}
    .post-body{padding:5px 16px 16px}
    .story{font-size:13px;line-height:1.72;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
    .story strong{font-weight:800;margin-right:5px}
    .comments{border-top:1px solid #f3f1ed;padding:12px 16px 14px}
    .comment-list{display:grid;gap:9px;margin-bottom:11px}
    .comment{font-size:11.5px;line-height:1.55;color:#4f4d48}
    .comment b{color:#1b1b1b;margin-right:5px;font-size:10.5px}
    .comment-form{display:flex;gap:8px}
    .comment-form input{
      flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;
      padding:10px 13px;background:#faf9f6;font-size:11px;outline:none
    }
    .comment-form input:focus{border-color:#bdb9b0;background:#fff}
    .comment-form button{
      border:0;background:transparent;font-size:10px;font-weight:900;letter-spacing:.06em;cursor:pointer;padding:0 2px
    }
    .empty{padding:70px 24px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
    .fab{
      position:fixed;z-index:35;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
      width:min(calc(100% - 28px),calc(var(--max) - 28px));
      background:var(--ink);color:#fff;border:0;border-radius:999px;height:52px;
      font-size:11px;font-weight:900;letter-spacing:.09em;box-shadow:0 12px 30px rgba(0,0,0,.16);cursor:pointer
    }
    dialog{
      width:min(calc(100% - 24px),620px);max-height:88dvh;border:0;border-radius:20px;padding:0;
      box-shadow:0 30px 90px rgba(0,0,0,.24);background:#fff;color:var(--ink)
    }
    #writeDialog{overflow:hidden}
    #writeDialog[open]{display:flex;flex-direction:column}
    #writeDialog .modal-head{flex-shrink:0}
    #postForm{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:max(20px,env(safe-area-inset-bottom))}
    .modal-head{position:sticky;top:0;background:#fff;z-index:2}
    .modal-close{min-width:44px;min-height:44px}
    dialog::backdrop{background:rgba(17,17,17,.38);backdrop-filter:blur(4px)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:19px 20px;border-bottom:1px solid var(--line)}
    .modal-head h3{font-size:12px;letter-spacing:.11em;text-transform:uppercase;margin:0}
    .modal-close{border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer}
    .form{padding:20px;display:grid;gap:16px;overflow:auto}
    .field{display:grid;gap:7px}
    label{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    input,textarea{
      width:100%;border:1px solid var(--line);background:#faf9f6;border-radius:12px;
      padding:13px 14px;outline:none;font-size:13px
    }
    textarea{min-height:124px;resize:vertical;line-height:1.6}
    input:focus,textarea:focus{background:#fff;border-color:#aaa59a}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .submit{
      height:48px;border:0;border-radius:12px;background:var(--ink);color:#fff;
      font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;cursor:pointer
    }
    .status{
      position:fixed;z-index:60;top:72px;left:50%;transform:translateX(-50%);
      background:#1d1d1d;color:#fff;padding:9px 13px;border-radius:999px;font-size:10px;
      opacity:0;pointer-events:none;transition:.2s;white-space:normal;width:max-content;max-width:calc(100% - 32px);text-align:center;line-height:1.6
    }
    .status.show{opacity:1}
    .submit:disabled{opacity:.55;cursor:wait}
    #formMessage{margin:0;color:#a13224;font-size:13px;line-height:1.6;overflow-wrap:anywhere}
    input,textarea{font-size:16px}
    .photo-preview,.photo-change{pointer-events:none}

    .photo-picker{
      position:relative;overflow:hidden;border:1px dashed #cbc6bd;border-radius:16px;
      background:#faf9f6;aspect-ratio:4/3;display:grid;place-items:center;cursor:pointer;
    }
    .photo-picker input{position:absolute;inset:0;opacity:0;cursor:pointer}
    .photo-empty{text-align:center;color:#74716a;pointer-events:none}
    .photo-empty .plus{font-size:28px;font-weight:300;line-height:1;margin-bottom:9px}
    .photo-empty strong{display:block;font-size:12px;color:#262626;margin-bottom:4px}
    .photo-preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
    .photo-picker.has-photo .photo-preview{display:block}
    .photo-picker.has-photo .photo-empty{display:none}
    .photo-change{
      display:none;position:absolute;right:10px;bottom:10px;border:0;background:rgba(20,20,20,.82);
      color:#fff;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:800;pointer-events:none
    }
    .photo-picker.has-photo .photo-change{display:block}
    .upload-progress{font-size:10px;color:var(--muted);min-height:15px}

    [hidden]{display:none!important}
    #coffeeType{font:inherit;font-size:16px;width:100%;min-height:48px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#faf9f6;color:var(--ink)}
    #coffeeType:focus-visible{outline:2px solid var(--coffee);outline-offset:2px}
    .coffee-tag{display:table;max-width:100%;margin:0 0 9px;padding:5px 9px;border-radius:7px;background:#f2ece6;color:var(--coffee);font-size:11px;line-height:1.5;overflow-wrap:anywhere}
    .qr-welcome{padding:4px 0 16px;border-bottom:1px solid var(--line)}
    .qr-eyebrow{font-size:11px;color:var(--coffee);font-weight:700}
    .qr-welcome h2{white-space:pre-line;font-size:25px;line-height:1.4;letter-spacing:-.045em;margin:12px 0}
    .qr-welcome p{font-size:13px;line-height:1.8;color:#66635f;margin:0}
    .qr-note{display:block;font-size:11px;color:#8c7664;margin-top:12px}
    .browse-stories{border:0;background:none;padding:10px;font-size:12px;color:#77716a;text-decoration:underline;cursor:pointer}
    #writeDialog.qr-entry{width:min(calc(100% - 24px),520px);max-height:94dvh}
    #writeDialog.qr-entry .modal-head{background:#f8f7f3}
    @media(max-width:520px){
      h1{font-size:29px}
      .hero{padding-top:34px}
      .grid2{grid-template-columns:1fr}
    }
  </style>
</head>

    </section>
    <section id="feedSection" aria-label="이야기" data-i18n-aria="feedLabel">

</div>

      <span class="qr-note" data-i18n="qrNote">회원가입 없이, 글만으로도 참여할 수 있어요.</span>
    </div>
    <div class="field">

    </div>

    </div>
    <div class="grid2">
      <div class="field">
        <label for="city" data-i18n="city">도시</label>

      </div>
      <div class="field">

      </div>
    </div>
    <div class="field">
      <label for="photoInput" data-i18n="photo">사진</label>

    </div>
    <p id="formMessage" role="alert" hidden></p>
    <button class="submit" type="submit">게시하기</button>

  async function requestJSON(url, options = {}){
    const controller = new AbortController();
    const parent = options.signal;
    const abort = ()=>controller.abort();
    if(parent?.aborted) controller.abort();
    else parent?.addEventListener("abort", abort, {once:true});
    const timer = setTimeout(()=>controller.abort(),25000);
    try{
      const response = await fetch(url,{...options,signal:controller.signal});
      const data = await response.json();
      if(!response.ok){
        const err = new Error(data.error?.message || `Request failed (${response.status})`);
        if(url.includes("api.cloudinary.com")) err.uiKey="uploadFailed";
        err.code = data.error?.status || String(response.status);
        throw err;
      }
      return data;
    }finally{
      clearTimeout(timer);
      parent?.removeEventListener("abort",abort);
    }
  }

  function encode(value){
    if(value === null) return {nullValue:null};
    if(typeof value === "string") return {stringValue:value};
    if(typeof value === "number") return {integerValue:String(value)};
    if(Array.isArray(value)) return {arrayValue:{values:value.map(encode)}};
    return {mapValue:{fields:Object.fromEntries(Object.entries(value).map(([k,v])=>[k,encode(v)]))}};
  }
  function decode(value){
    if("stringValue" in value) return value.stringValue;
    if("timestampValue" in value) return value.timestampValue;
    if("integerValue" in value) return Number(value.integerValue);
    if("doubleValue" in value) return Number(value.doubleValue);
    if("arrayValue" in value) return (value.arrayValue.values || []).map(decode);
    if("mapValue" in value) return Object.fromEntries(Object.entries(value.mapValue.fields || {}).map(([k,v])=>[k,decode(v)]));
    return null;
  }
  async function commit(writes, signal){

  function blobFromCanvas(canvas, quality){
    return new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", quality));
  }

  function readImageFile(file){
    return new Promise((resolve,reject)=>{
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
      img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error(t("imageRead"))); };
      img.src = url;
    });
  }

  async function prepareImage(file){
    const img = await readImageFile(file);

    const srcRatio = img.naturalWidth / img.naturalHeight;
    const targetRatio = 4 / 3;
    let sx=0, sy=0, sw=img.naturalWidth, sh=img.naturalHeight;

    // 가운데 기준으로 4:3 자동 크롭
    if(srcRatio > targetRatio){
      sw = Math.round(img.naturalHeight * targetRatio);
      sx = Math.round((img.naturalWidth - sw) / 2);
    }else if(srcRatio < targetRatio){
      sh = Math.round(img.naturalWidth / targetRatio);
      sy = Math.round((img.naturalHeight - sh) / 2);
    }

    let outW = Math.min(1600, sw);
    let outH = Math.round(outW * 3 / 4);
    if(outH > 1200){
      outH = 1200;
      outW = 1600;
    }

    let canvas = document.createElement("canvas");
    let ctx = canvas.getContext("2d", {alpha:false});

    async function drawAndEncode(width, height){
      canvas.width = width;
      canvas.height = height;
      ctx = canvas.getContext("2d", {alpha:false});
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0,0,width,height);
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, width, height);

      let quality = 0.86;
      let blob = await blobFromCanvas(canvas, quality);

      while(blob && blob.size > MAX_IMAGE_BYTES && quality > 0.42){
        quality -= 0.07;
        blob = await blobFromCanvas(canvas, quality);
      }
      return blob;
    }

    let blob = await drawAndEncode(outW,outH);

    // 품질만으로 500KB 아래로 안 내려가면 해상도를 단계적으로 축소
    while(blob && blob.size > MAX_IMAGE_BYTES && outW > 720){
      outW = Math.round(outW * 0.82);
      outH = Math.round(outW * 3 / 4);
      blob = await drawAndEncode(outW,outH);
    }

    if(!blob || blob.size > MAX_IMAGE_BYTES) throw new Error(t("imageSize"));
    return blob;
  }

  async function uploadToCloudinary(blob,signal){
    if(blob.size > MAX_IMAGE_BYTES) throw Object.assign(new Error(t("imageSize")),{uiKey:"imageSize"});
    const formData = new FormData();
    formData.append("file", blob, preparedPhotoName);
    formData.append("upload_preset", UPLOAD_PRESET);
    const data = await requestJSON(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,{method:"POST",body:formData,signal});
    if(!data.secure_url) throw Object.assign(new Error(t("uploadFailed")),{uiKey:"uploadFailed"});
    return data.secure_url;
  }

    const current=revision;
    const post={authorSeed,city:document.querySelector("#city").value.trim(),country:document.querySelector("#country").value.trim(),story,coffeeCode,coffeeType,likes:0,comments:[],imageUrl:""};
    const controller=new AbortController();
    activeRequest=controller;
    formMessage.hidden=true;
    setBusy(true);
    if(!draftId) draftId=typeof crypto.randomUUID === "function" ? crypto.randomUUID() : "moment-"+Date.now()+"-"+Math.random().toString(36).slice(2);
    const id=draftId;
    try{
      if(preparedPhotoBlob && !uploadedPhotoUrl){
        setProgress("uploading");
        uploadedPhotoUrl=await uploadToCloudinary(preparedPhotoBlob,controller.signal);
      }
      if(current!==revision || controller.signal.aborted) return;
      post.imageUrl=uploadedPhotoUrl;
      setProgress("saving");
      try{
        await commit([{update:{name:documentRoot+"/posts/"+id,fields:encode(post).mapValue.fields},updateTransforms:[{fieldPath:"createdAt",setToServerValue:"REQUEST_TIME"}],currentDocument:{exists:false}}],controller.signal);
      }catch(err){
        // A timed-out request can have reached the server. Reusing its ID prevents duplicates.
        if(err.code!=="ALREADY_EXISTS") throw err;
      }
      if(current!==revision) return;
      feedState="ready";
      visiblePosts.unshift({...post,id,createdAt:new Date().toISOString()});
      renderPosts(visiblePosts);
      writeDialog.close();
      resetDraft();
      toast("posted");
      loadFeed();
    }catch(err){
      if(current===revision){setProgress("");toast(errorText(err));}
    }finally{
      if(current===revision){activeRequest=null;setBusy(false);}
    }
  });

  function openWriter(qr=false){
    writeDialog.classList.toggle("qr-entry",qr);
    document.querySelector("#qrWelcome").hidden=!qr;
    document.querySelector("#browseStories").hidden=!qr;
    writeDialog.showModal();
    document.querySelector("#writerTitle").focus();
  }
  // Closing keeps the current draft, including the selected photo and coffee.
  writeDialog.addEventListener("cancel",e=>{if(busy)e.preventDefault();});
  document.querySelector("#browseStories").onclick=()=>{if(!busy)writeDialog.close();};
  applyLanguage();
  loadFeed();
  window.addEventListener("online",()=>loadFeed());
  document.querySelector("#fab").onclick=()=>openWriter();
  if(isQrEntry) openWriter(true);
  languageSelect.addEventListener("change",()=>{language=languageSelect.value==="en"?"en":"ko";savePreference("coffee-language",language);applyLanguage();});
  document.querySelectorAll("[data-close]").forEach(btn=>{
    btn.onclick=()=>{if(!busy)document.querySelector("#"+btn.dataset.close).close();};
  });
</script>
</body>
</html>
